name: One-time Git history privacy reset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/history-privacy-reset.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-privacy-reset
  cancel-in-progress: false

jobs:
  reset-history:
    name: Preserve current files and replace old public history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm only the expected branch exists
        shell: bash
        run: |
          set -euo pipefail
          branches="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)"
          printf '%s\n' "$branches"
          if [ "$branches" != "main" ]; then
            echo "Expected only main. Stop rather than leave another public branch with old history."
            exit 1
          fi
          tags="$(git ls-remote --tags origin)"
          if [ -n "$tags" ]; then
            echo "Tags exist. Stop rather than leave old history reachable through tags."
            exit 1
          fi

      - name: Save a short-lived snapshot of current files
        uses: actions/upload-artifact@v4
        with:
          name: pre-history-reset-current-files
          path: |
            !.git
            .
          include-hidden-files: true
          retention-days: 7

      - name: Create a clean root commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Md. Tanvir Hossain"
          git config user.email "273018097+thnayem@users.noreply.github.com"
          git checkout --orphan privacy-clean-main
          git add --all
          git commit -m "chore: establish clean repository history"
          git push --force origin HEAD:refs/heads/main

      - name: Confirm rewritten main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          count="$(git rev-list --count origin/main)"
          echo "Commit count after reset: $count"
          test "$count" = "1"
          git show -s --format='Author: %an <%ae>%nCommitter: %cn <%ce>%nCommit: %H' origin/main
